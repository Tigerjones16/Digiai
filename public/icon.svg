<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#003b8e" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>
  <!-- Background with Safe Padding for Maskable -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Central Emblem within safe 80% circle zone -->
  <g transform="translate(256, 256)">
    <!-- Outer Ring -->
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-dasharray="16 12" />
    <!-- AI Sparkle Core -->
    <path d="M 0 -90 Q 0 0 -90 0 Q 0 0 0 90 Q 0 0 90 0 Q 0 0 0 -90 Z" fill="url(#sparkle)" />
    <!-- Sub-Sparkle Accent -->
    <circle cx="55" cy="-55" r="16" fill="#60a5fa" />
    <circle cx="-55" cy="55" r="12" fill="#93c5fd" />
  </g>
</svg>
